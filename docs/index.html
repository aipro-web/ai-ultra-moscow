<!doctype html>
<html lang="ru" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AI Ultra — Live Carousel</title>
<style>
/* LOCKED base shell from v1.5.9.6 */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050607;color:#fff;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#canvas-container{position:fixed;inset:0;width:100vw;height:100vh}
canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
#status{display:none;position:fixed;left:16px;top:16px;z-index:60000;max-width:min(560px,calc(100vw - 32px));padding:10px 12px;border:1px solid #ffffff22;border-radius:10px;background:#111e;color:#fff;font:12px/1.4 system-ui}
#status.show{display:block}

/* Card content / CTA skin. Safe visual-edit surface. */
.card-number{position:fixed;left:0;top:0;z-index:8100;pointer-events:none;min-width:20px;padding:3px 5px 4px;border-radius:7px;background:linear-gradient(180deg,rgba(30,21,8,.78),rgba(5,5,6,.76));border:1px solid rgba(255,220,145,.38);color:#ffe8b3;font:850 clamp(11px,1vw,14px)/1 system-ui;text-align:center;text-shadow:0 1px 8px rgba(0,0,0,.72);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);transform-origin:0 0;box-shadow:inset 0 0 8px rgba(255,222,150,.08),0 0 10px rgba(213,166,74,.08)}
.card-number.is-hero{min-width:23px;font-size:clamp(13px,1.12vw,16px);border-color:rgba(255,226,158,.58);background:linear-gradient(180deg,rgba(63,44,14,.84),rgba(7,6,5,.79));box-shadow:inset 0 0 10px rgba(255,225,159,.10),0 0 14px rgba(230,182,85,.16)}
.core-card-layer{position:fixed;inset:0;z-index:8400;pointer-events:none}.core-card-content{position:fixed;display:flex;flex-direction:column;justify-content:space-between;gap:10px;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .22s ease,transform .28s cubic-bezier(.2,.8,.2,1),filter .22s ease;overflow:hidden;color:#fffaf0;text-shadow:0 2px 16px rgba(0,0,0,.70);border-radius:var(--card-radius,28px);background:linear-gradient(145deg,rgba(30,25,17,.88),rgba(8,8,9,.90) 48%,rgba(96,58,8,.62));box-shadow:inset 0 0 34px rgba(255,220,138,.055);backdrop-filter:blur(12px) saturate(.88);-webkit-backdrop-filter:blur(12px) saturate(.88)}
.core-card-content.is-visible{opacity:1;transform:translateY(0)}
.core-card-content.is-loading{opacity:.28;filter:blur(3px);transform:translateY(-5px) scale(.985)}
.core-card-copy{display:grid;gap:var(--copy-gap,8px);max-width:100%;min-height:0}
.core-card-eyebrow{font:800 var(--eyebrow-size,10px)/1 system-ui;letter-spacing:.17em;color:#f0d69b;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.core-card-title{max-width:100%;font:850 var(--title-size,30px)/.98 system-ui;letter-spacing:-.04em;display:-webkit-box;-webkit-line-clamp:var(--title-lines,2);-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.core-card-body{max-width:100%;color:rgba(255,249,235,.76);font:580 var(--body-size,12px)/1.38 system-ui;display:-webkit-box;-webkit-line-clamp:var(--body-lines,4);-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.core-card-actions{display:grid;gap:8px;width:100%;pointer-events:auto;min-width:0;margin-top:auto}
.core-card-button{width:100%;height:42px;min-height:42px;max-height:42px;padding:0 10px;border-radius:14px;cursor:pointer;font:760 12px/1 system-ui;letter-spacing:.01em;transition:transform .16s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease;touch-action:manipulation;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;justify-content:center;min-width:0}
.core-card-button:hover{transform:translateY(-1px)}
.core-card-button:active{transform:translateY(0) scale(.985)}
.core-card-button-primary{border:1px solid rgba(255,255,255,.88);background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(239,235,225,.92));box-shadow:inset 0 1px 0 rgba(255,255,255,1),0 7px 20px rgba(0,0,0,.26),0 0 16px rgba(255,242,211,.12);color:#17120b;text-shadow:none}
.core-card-button-secondary{border:1px solid rgba(255,255,255,.50);background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.075));box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 6px 18px rgba(0,0,0,.22);color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.55)}
body.core-route-loading .core-card-layer,body.core-route-loading .card-number{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
body.core-route-loading .core-card-content{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
.core-card-content[data-mode="micro"]{gap:7px}
.core-card-content[data-mode="micro"] .core-card-actions{gap:6px}
.core-card-content[data-mode="small"]{gap:8px}
.core-card-content[data-mode="small"] .core-card-actions{gap:7px}

/* HUD / menu / search / route-loading UI. */
.core-route-loader{position:fixed;left:50%;top:24px;z-index:57000;display:none;gap:8px;width:min(300px,calc(100vw - 48px));opacity:0;pointer-events:none;transform:translate(-50%,-10px);transition:opacity .2s ease,transform .25s ease}
body.core-route-loading .core-route-loader{opacity:0;transform:translate(-50%,-10px)}
.core-route-loader-label{text-align:center;color:rgba(249,231,188,.72);font:800 10px/1 system-ui;letter-spacing:.16em}
.core-route-loader-track{height:2px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.1)}
.core-route-loader-track i{display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#f0cf8b,#fff3d1);box-shadow:0 0 18px rgba(222,184,98,.7);animation:core-route-progress 1.15s ease-in-out infinite}
@keyframes core-route-progress{0%{transform:translateX(-120%)}55%{transform:translateX(135%)}100%{transform:translateX(300%)}}
.core-overlay{position:fixed;inset:0;z-index:56000;opacity:0;pointer-events:none;background:rgba(0,0,0,.18);backdrop-filter:blur(0);transition:opacity .2s ease,backdrop-filter .25s ease}
body.core-search-open .core-search,body.core-menu-open .core-menu{opacity:1;pointer-events:auto;backdrop-filter:blur(5px)}
.core-search-panel{position:absolute;left:50%;top:7vh;width:min(760px,calc(100vw - 64px));border:1px solid rgba(235,205,141,.18);border-radius:26px;background:rgba(8,8,10,.94);box-shadow:0 28px 90px rgba(0,0,0,.55),0 0 40px rgba(202,164,86,.08);transform:translate(-50%,-24px) scale(.97);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
body.core-search-open .core-search-panel{transform:translate(-50%,0) scale(1)}
.core-search-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;min-height:72px;padding:0 18px 0 22px;border-bottom:1px solid rgba(255,255,255,.1)}
.core-search-icon{font:400 30px/1 system-ui;color:#e5c67f}
.core-search-input{width:100%;border:0;outline:0;background:transparent;color:#fff;font:600 clamp(16px,2vw,24px)/1.2 system-ui}
.core-search-input::placeholder{color:rgba(255,255,255,.4)}
.core-empty{padding:18px 22px 22px;color:rgba(255,255,255,.55);font:500 13px/1.45 system-ui}
.core-close{width:40px;height:40px;border-radius:999px;border:1px solid rgba(238,206,135,.16);background:rgba(255,255,255,.05);color:#fff7e4;cursor:pointer;font:300 26px/1 system-ui}
.core-menu-panel{position:absolute;right:24px;top:24px;bottom:24px;width:min(360px,calc(100vw - 48px));border:1px solid rgba(235,205,141,.16);border-radius:26px;background:rgba(8,8,10,.95);box-shadow:0 28px 90px rgba(0,0,0,.55);transform:translateX(calc(100% + 48px));transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow:hidden}
body.core-menu-open .core-menu-panel{transform:translateX(0)}
.core-menu-head{height:68px;padding:0 16px 0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.1)}
.core-menu-head strong{font:800 13px/1 system-ui;letter-spacing:.15em}
.core-menu-body{display:grid;gap:8px;padding:12px}
.core-menu-body button{border:1px solid rgba(243,215,153,.12);border-radius:14px;background:rgba(255,255,255,.035);color:#fff7e4;padding:13px 14px;text-align:left;cursor:pointer;font:600 13px/1 system-ui}
.core-menu-body button:hover{background:rgba(224,185,99,.10)}
.core-toast{position:fixed;left:50%;bottom:28px;z-index:60000;padding:9px 13px;border-radius:999px;background:rgba(7,7,9,.92);border:1px solid rgba(235,204,136,.16);color:#fff7e4;font:600 12px/1 system-ui;opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:opacity .16s ease,transform .16s ease;backdrop-filter:blur(10px)}
.core-toast.show{opacity:1;transform:translate(-50%,0)}
.core-hud{position:fixed;left:18px;top:50%;z-index:12000;display:flex;flex-direction:column;gap:12px;transform:translateY(-50%);pointer-events:auto;transition:opacity .18s ease}
.core-hud-button{width:58px;height:58px;border-radius:18px;border:1px solid rgba(255,214,119,.54);background:linear-gradient(145deg,rgba(30,25,17,.88),rgba(8,8,9,.90) 48%,rgba(96,58,8,.62));box-shadow:inset 0 0 22px rgba(255,220,138,.10),0 0 22px rgba(213,157,49,.20),0 10px 26px rgba(0,0,0,.30);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;display:grid;place-items:center;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease,background .16s ease}
.core-hud-button:hover{transform:scale(1.08);border-color:rgba(255,228,160,.82);box-shadow:inset 0 0 24px rgba(255,225,153,.14),0 0 30px rgba(226,173,62,.32),0 12px 30px rgba(0,0,0,.34)}
.core-hud-button:active{transform:scale(.97)}
.core-hud-button svg{width:30px;height:30px;fill:none;stroke:#fff1ca;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(239,190,80,.35))}
.core-hud-button svg path:first-child,.core-hud-button svg circle{stroke:#fff1ca}
.core-hud-button.is-active{background:linear-gradient(145deg,rgba(75,48,10,.94),rgba(17,13,8,.94) 48%,rgba(150,91,13,.68));border-color:rgba(255,226,153,.82)}
body.core-route-loading .core-hud{opacity:0!important;visibility:hidden!important;pointer-events:none!important}

@media(max-width:700px){
  .core-hud{left:10px;gap:9px}
  .core-hud-button{width:48px;height:48px;border-radius:15px}
  .core-hud-button svg{width:25px;height:25px;stroke-width:4.4}
}




/* v1.5.9.20 SEO hero / logo overlay. Carousel physics untouched. */
.card-number{max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.card-number.is-brand{font-size:clamp(13px,1.2vw,17px);letter-spacing:.12em;color:#fff3cf;min-width:auto}
.core-card-content{overflow:hidden}
.core-card-copy{padding-top:var(--copy-clearance,0px);overflow:hidden;max-height:calc(100% - 96px)}
.core-card-eyebrow:empty{display:none}
.core-card-logo{position:absolute;right:var(--logo-inset,18px);top:var(--logo-inset,18px);width:var(--logo-size,72px);height:var(--logo-size,72px);object-fit:contain;z-index:4;pointer-events:none;user-select:none;filter:drop-shadow(0 4px 14px rgba(0,0,0,.30)) drop-shadow(0 0 12px rgba(236,177,58,.10))}
.core-card-title{overflow-wrap:normal;word-break:normal}
</style>
</head>
<body data-carousel-core="pure">
<div id="canvas-container" aria-hidden="true"></div>
<div id="status" role="status" aria-live="polite"></div>
<script>
window.__AIULTRA_SHOW_FATAL__=function(message){
  const el=document.getElementById('status');
  if(!el)return;
  el.textContent=message;
  el.classList.add('show');
};
window.addEventListener('error',event=>{
  if(event?.message) window.__AIULTRA_SHOW_FATAL__('Runtime error: '+event.message);
},true);
window.addEventListener('unhandledrejection',event=>{
  const reason=event?.reason;
  window.__AIULTRA_SHOW_FATAL__('Runtime error: '+((reason&&reason.message)||String(reason||'unknown error')));
});
</script>
<script>

<script>
(() => {
  const toast = document.createElement('div');
  toast.className = 'core-toast';
  document.body.appendChild(toast);
  let toastTimer = 0;

  const demoContent = Array.isArray(window.AIULTRA_CONTENT) && window.AIULTRA_CONTENT.length
    ? window.AIULTRA_CONTENT
    : [
    {meta:'AI ULTRA',eyebrow:'',title:'AI-сотрудники для взлёта ваших продаж',body:'ИИ / AI-агенты для продаж, маркетинга, CRM и автоматизации бизнеса — Внедряем ИИ и AI-решения под ключ: автоматизируем процессы, усиливаем продажи и подключаем CRM, аналитику и маркетинг в единую систему роста.',primary:'Запустить проект',secondary:'Смотреть решения'},
    {meta:'GROWTH 02',eyebrow:'',title:'AI-агенты для бизнеса',body:'ИИ / AI-сотрудники под задачи компании — Продажи, CRM, поддержка, документы и бизнес-процессы. Интеграции, тестирование и сопровождение.',primary:'Рассчитать AI-агента',secondary:'Возможности'},
    {meta:'AUTOMATION 03',eyebrow:'',title:'Автоматизация процессов',body:'ИИ + AI-агенты + CRM + 1С + API — Автоматизируем продажи, документы, поддержку, закупки и аналитику в единой системе.',primary:'Найти процессы',secondary:'Как внедряем'},
    {meta:'SALES 04',eyebrow:'',title:'AI для продаж',body:'Обработка лидов и квалификация 24/7 — AI-продавец ведёт диалог, фиксирует данные в CRM и передаёт менеджеру готовый контекст.',primary:'Рассчитать AI-продавца',secondary:'Сценарии'},
    {meta:'INDUSTRIES 05',eyebrow:'',title:'ИИ для отраслей',body:'AI-сценарии под конкретный бизнес — Бухгалтерия, строительство, закупки, тендеры и другие направления с отдельной логикой автоматизации.',primary:'Выбрать отрасль',secondary:'Все решения'},
    {meta:'INTEGRATIONS 06',eyebrow:'',title:'CRM, 1С и API',body:'AI внутри существующей инфраструктуры — CRM, телефония, сайт, Telegram, 1С, email и API — связываем данные и автоматические действия.',primary:'Проверить интеграцию',secondary:'Системы'},
    {meta:'CASES 07',eyebrow:'',title:'Кейсы внедрения',body:'Реальные процессы и измеримый эффект — Показываем, как ИИ и AI работают вместе с командой и какие изменения получает бизнес после внедрения.',primary:'Смотреть кейсы',secondary:'Результаты'},
    {meta:'PRICING 08',eyebrow:'',title:'Стоимость внедрения',body:'Расчёт под задачу, интеграции и архитектуру — Цена зависит от сценария, каналов и уровня автономности. Сначала считаем ожидаемый эффект и формат запуска.',primary:'Получить расчёт',secondary:'Этапы'},
    {meta:'FAQ 09',eyebrow:'',title:'Вопросы и ответы',body:'Как запускается ИИ / AI в компании — Что автоматизировать, как подключить CRM и 1С, где нужен человек и как стартует первый AI-сценарий.',primary:'Задать вопрос',secondary:'FAQ'},
      ];

  const layer = document.createElement('div');
  layer.className = 'core-card-layer';
  document.body.appendChild(layer);

  function createCardOverlay(index) {
    const card = document.createElement('section');
    card.className = 'core-card-content';
    card.dataset.overlayIndex = String(index);
    card.innerHTML = `
      <img class="core-card-logo" src="./assets/ai-ultra-logo.png" alt="AI Ultra">
      <div class="core-card-copy">
        <span class="core-card-eyebrow"></span>
        <h2 class="core-card-title"></h2>
        <p class="core-card-body"></p>
      </div>
      <div class="core-card-actions">
        <button class="core-card-button core-card-button-primary" type="button"></button>
        <button class="core-card-button core-card-button-secondary" type="button"></button>
      </div>`;
    const primary = card.querySelector('.core-card-button-primary');
    const secondary = card.querySelector('.core-card-button-secondary');
    primary.addEventListener('pointerdown', e => e.stopPropagation());
    secondary.addEventListener('pointerdown', e => e.stopPropagation());
    primary.addEventListener('click', event => {
      event.stopPropagation();
      const target = Number(card.dataset.primaryTarget || 0);
      if (target) beginSceneRoute(target, contentForSequence(target).title);
    });
    secondary.addEventListener('click', event => {
      event.stopPropagation();
      const target = Number(card.dataset.secondaryTarget || 0);
      if (target) beginSceneRoute(target, contentForSequence(target).title);
    });
    layer.appendChild(card);
    return card;
  }

  const overlayPool = Array.from({ length: 7 }, (_, i) => createCardOverlay(i));


  // Fixed screen-space HUD. These three controls never inherit carousel depth/position,
  // so they cannot disappear behind glass or keep drifting after the 3D motion stops.
  const hud = document.createElement('nav');
  hud.className = 'core-hud';
  hud.setAttribute('aria-label', 'Основные кнопки');
  hud.innerHTML = `
    <button class="core-hud-button" type="button" data-hud="menu" aria-label="Меню">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 14h28M10 24h28M10 34h28"/></svg>
    </button>
    <button class="core-hud-button" type="button" data-hud="music" aria-label="Музыка">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 20h7l10-8v24l-10-8h-7z"/><path class="music-slash" d="M12 10l25 28"/></svg>
    </button>
    <button class="core-hud-button" type="button" data-hud="search" aria-label="Поиск">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="21" cy="21" r="10"/><path d="M29 29l9 9"/></svg>
    </button>`;
  document.body.appendChild(hud);
  let musicMuted = true;
  hud.querySelector('[data-hud="menu"]').addEventListener('click', () => {
    window.dispatchEvent(new CustomEvent('aiultra:menu-request'));
  });
  hud.querySelector('[data-hud="search"]').addEventListener('click', () => {
    window.dispatchEvent(new CustomEvent('aiultra:search-request'));
  });
  hud.querySelector('[data-hud="music"]').addEventListener('click', buttonEvent => {
    musicMuted = !musicMuted;
    buttonEvent.currentTarget.classList.toggle('is-active', !musicMuted);
    window.dispatchEvent(new CustomEvent('aiultra:music-toggle', { detail:{ muted:musicMuted } }));
  });

  const routeLoader = document.createElement('div');

  function contentForSequence(sequence) {
    return demoContent[(Math.max(1, Number(sequence) || 1) - 1) % demoContent.length];
  }

  function targetAfter(sequence, amount = 1) {
    const n = Math.max(1, Math.round(Number(sequence) || 1));
    return ((n - 1 + amount) % 500) + 1;
  }


  function intersection(a, b) {
    const left=Math.max(a.left,b.left), right=Math.min(a.right,b.right);
    const top=Math.max(a.top,b.top), bottom=Math.min(a.bottom,b.bottom);
    if (right <= left || bottom <= top) return null;
    return {left,right,top,bottom,width:right-left,height:bottom-top};
  }

  function exposedContentBounds(entry, allVisible) {
    const b={...entry.bounds};
    let intervals=[[b.left,b.right]];
    const blockers=allVisible.filter(other => {
      if (other === entry || !other.bounds) return false;
      if (entry.isHero) return false;
      return other.isHero || Number(other.renderOrder || 0) > Number(entry.renderOrder || 0);
    });

    for (const blocker of blockers) {
      const overlap=intersection(b, blocker.bounds);
      if (!overlap || overlap.height < b.height*.24 || overlap.width < 8) continue;
      const cutL=overlap.left, cutR=overlap.right;
      const next=[];
      for (const [l,r] of intervals) {
        if (cutR <= l || cutL >= r) { next.push([l,r]); continue; }
        if (cutL > l) next.push([l,Math.min(cutL,r)]);
        if (cutR < r) next.push([Math.max(cutR,l),r]);
      }
      intervals=next;
      if (!intervals.length) break;
    }

    if (!intervals.length) return null;
    intervals.sort((a,b2)=>(b2[1]-b2[0])-(a[1]-a[0]));
    const [left,right]=intervals[0];
    const width=right-left;
    if (width < 54) return null;
    return {left,right,top:b.top,bottom:b.bottom,width,height:b.height};
  }

  function contentModeForBounds(bounds, isHero) {
    const w=Math.max(1,bounds.width), h=Math.max(1,bounds.height);
    const area=w*h;
    if(isHero || (w>=260 && h>=430) || area>=125000) return 'hero';
    if(w>=185 && h>=320) return 'medium';
    if(w>=135 && h>=235) return 'small';
    return 'micro';
  }

  function adaptiveMetrics(bounds, mode) {
    const w=Math.max(1,bounds.width), h=Math.max(1,bounds.height);
    const shortSide=Math.min(w,h);
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

    const presets={
      hero:{padX:.078,padTop:.105,padBottom:.064,title:[24,34],body:[11.2,12.6],eyebrow:[9,11],copyGap:[7,10],titleLines:3,bodyLines:3},
      medium:{padX:.082,padTop:.10,padBottom:.060,title:[20,29],body:[10.2,11.7],eyebrow:[8.5,10],copyGap:[6,8],titleLines:3,bodyLines:3},
      small:{padX:.088,padTop:.082,padBottom:.045,title:[14.5,21.5],body:[8.5,9.9],eyebrow:[7.4,8.9],copyGap:[4,6],titleLines:2,bodyLines:2},
      micro:{padX:.095,padTop:.075,padBottom:.035,title:[12,18],body:[7.8,9.3],eyebrow:[6.8,8.0],copyGap:[3,5],titleLines:2,bodyLines:2}
    };
    const p=presets[mode];
    const density=clamp((shortSide-90)/230,0,1);
    const lerp=(a,b,t)=>a+(b-a)*t;

    return {
      padX:clamp(w*p.padX,10,34),
      padTop:clamp(h*p.padTop,12,78),
      padBottom:clamp(h*p.padBottom,8,36),
      title:lerp(p.title[0],p.title[1],density),
      body:lerp(p.body[0],p.body[1],density),
      eyebrow:lerp(p.eyebrow[0],p.eyebrow[1],density),
      copyGap:lerp(p.copyGap[0],p.copyGap[1],density),
      titleLines:p.titleLines,
      bodyLines:p.bodyLines,
      radius:clamp(w*.19,18,42)
    };
  }

  function applyOverlayContent(node, item, bounds, { isHero, sequence, renderOrder = 0 }) {
    node.querySelector('.core-card-eyebrow').textContent = item.eyebrow;
    node.querySelector('.core-card-title').textContent = item.title;
    node.querySelector('.core-card-body').textContent = item.body;
    node.querySelector('.core-card-button-primary').textContent = item.primary;
    node.querySelector('.core-card-button-secondary').textContent = item.secondary;

    const mode=contentModeForBounds(bounds,isHero);
    const m=adaptiveMetrics(bounds,mode);

    node.style.left = `${Math.round(bounds.left)}px`;
    node.style.top = `${Math.round(bounds.top)}px`;
    node.style.width = `${Math.max(72, Math.round(bounds.width))}px`;
    node.style.height = `${Math.max(104, Math.round(bounds.height))}px`;
    node.style.padding = `${Math.round(m.padTop)}px ${Math.round(m.padX)}px ${Math.round(m.padBottom)}px`;
    node.style.setProperty('--card-radius', `${m.radius.toFixed(1)}px`);
    node.style.setProperty('--eyebrow-size', `${m.eyebrow.toFixed(2)}px`);
    node.style.setProperty('--title-size', `${m.title.toFixed(2)}px`);
    node.style.setProperty('--body-size', `${m.body.toFixed(2)}px`);
    node.style.setProperty('--copy-gap', `${m.copyGap.toFixed(2)}px`);
    node.style.setProperty('--title-lines', String(m.titleLines));
    node.style.setProperty('--body-lines', String(m.bodyLines));
    const logoSize=Math.max(22,Math.min(bounds.width*.24,isHero?98:72));
    const logoInset=Math.max(9,Math.min(bounds.width*.065,24));
    const copyClearance=Math.max(22,Math.min(bounds.height*(isHero ? .14 : .10),isHero?92:58));
    node.style.setProperty('--logo-size', `${logoSize.toFixed(1)}px`);
    node.style.setProperty('--logo-inset', `${logoInset.toFixed(1)}px`);
    node.style.setProperty('--copy-clearance', `${copyClearance.toFixed(1)}px`);
    node.style.zIndex = String(8400 + Math.max(0, Math.round(renderOrder)));
    node.dataset.mode=mode;

    node.classList.toggle('is-hero', isHero);
    node.classList.toggle('is-support', !isHero);
    node.classList.toggle('is-loading', routeLoading && routeTarget === sequence);

    // Full content remains present on every card. Typography and spacing, not visibility,
    // adapt to the actual projected card bounds.
    node.querySelector('.core-card-body').style.display = '';
    node.querySelector('.core-card-button-primary').style.display = '';
    node.querySelector('.core-card-button-secondary').style.display = '';

    node.dataset.primaryTarget = String(isHero ? targetAfter(sequence, 4) : sequence);
    node.dataset.secondaryTarget = String(targetAfter(sequence, 1));
    node.classList.add('is-visible');
  }

  function hideUnusedOverlays(startIndex = 0) {
    for (let i = startIndex; i < overlayPool.length; i++) {
      overlayPool[i].classList.remove('is-visible', 'is-loading', 'is-hero', 'is-support', 'is-compact');
      delete overlayPool[i].dataset.mode;
    }
  }

  function renderSceneCards(state) {
    if (routeLoading) {
      hideUnusedOverlays(0);
      return;
    }

    const visible = (state?.visible || [])
      .filter(item => item?.bounds && item.bounds.width >= 54 && item.bounds.height >= 90)
      .sort((a, b) => Number(a.renderOrder || 0) - Number(b.renderOrder || 0))
      .slice(0, overlayPool.length);

    if (!visible.length) {
      hideUnusedOverlays(0);
      return;
    }

    visible.forEach((entry, index) => {
      const item = contentForSequence(entry.sequenceNumber);
      applyOverlayContent(overlayPool[index], item, entry.bounds, {
        isHero: entry.isHero,
        sequence: entry.sequenceNumber,
        renderOrder: entry.renderOrder || 0
      });
    });
    hideUnusedOverlays(visible.length);
  }

  function beginSceneRoute(targetSequence, label = 'Раздел', targetUrl = null) {
    if (routeLoading || !window.AIUltraScene?.goToSequence) return;
    closeMenu(); closeSearch();
    routeLoading = true;
    routeTarget = targetSequence;
    routeExternalUrl = null;
    document.body.classList.add('core-route-loading');
    hideUnusedOverlays(0);
    routeLoader.querySelector('.core-route-loader-label').textContent = `ЗАГРУЗКА · ${String(label).toUpperCase()}`;

    // Internal links keep the current WebGL scene mounted. External destinations (Telegram etc.)
    // are opened only after the 1.5 s camera ride.
    try {
      const nextUrl = targetUrl || `${location.pathname}?section=${encodeURIComponent(targetSequence)}`;
      const parsed = new URL(nextUrl, location.href);
      if (parsed.origin === location.origin) history.pushState({sequence:targetSequence,label}, '', parsed.href);
      else routeExternalUrl = parsed.href;
    } catch (_) {
      routeExternalUrl = targetUrl || null;
    }

    window.AIUltraScene.goToSequence(targetSequence, {
      source:'core-route',
      forceForward:true,
      duration:1.5
    });
  }

  window.addEventListener('aiultra:scene-state', event => {
    const state = event.detail || null;
    activeSequence = state?.activeSequence || 1;
    renderSceneCards(state);
  });

  window.addEventListener('aiultra:navigation-start', event => {
    if (event.detail?.source === 'core-route') {
      routeLoading = true;
      routeTarget = event.detail?.sequenceNumber || routeTarget;
      document.body.classList.add('core-route-loading');
      hideUnusedOverlays(0);
    }
  });

  window.addEventListener('aiultra:navigation-end', event => {
    if (event.detail?.source !== 'core-route') return;
    const externalUrl = routeExternalUrl;
    routeExternalUrl = null;
    routeLoading = false;
    routeTarget = null;
    document.body.classList.remove('core-route-loading');
    const state = window.AIUltraScene?.getState?.();
    if (state) renderSceneCards(state);
    if (externalUrl) window.location.assign(externalUrl);
  });

  document.addEventListener('click', event => {
    const trigger = event.target.closest?.('[data-ai-sequence]');
    if (!trigger) return;
    event.preventDefault();
    beginSceneRoute(Number(trigger.dataset.aiSequence), trigger.dataset.aiLabel || 'Раздел', trigger.dataset.aiUrl || null);
  });


  window.addEventListener('popstate', event => {
    const sequence=Number(event.state?.sequence || 0);
    if (!sequence || routeLoading) return;
    routeLoading = true;
    routeTarget = sequence;
    document.body.classList.add('core-route-loading');
    hideUnusedOverlays(0);
    window.AIUltraScene?.goToSequence?.(sequence,{
      source:'core-route',forceForward:true,duration:1.5
    });
  });

  window.addEventListener('aiultra:search-request', () => {
    closeMenu();
    document.body.classList.add('core-search-open');
    requestAnimationFrame(() => search.querySelector('input')?.focus());
  });
  window.addEventListener('aiultra:menu-request', () => {
    closeSearch();
    document.body.classList.toggle('core-menu-open');
  });
  window.addEventListener('aiultra:music-toggle', event => {
    showToast(event.detail?.muted ? 'Музыка выключена' : 'Музыка включена');
  });

  search.querySelector('.core-close')?.addEventListener('click', closeSearch);
  menu.querySelector('.core-close')?.addEventListener('click', closeMenu);
  search.addEventListener('pointerdown', e => { if (e.target === search) closeSearch(); });
  menu.addEventListener('pointerdown', e => { if (e.target === menu) closeMenu(); });
  menu.querySelectorAll('[data-go]').forEach(button => {
    button.addEventListener('click', () => {
      beginSceneRoute(Number(button.dataset.go), `Карточка ${button.dataset.go}`);
      closeMenu();
    });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeSearch(); closeMenu(); }
  });

  const initialState = window.AIUltraScene?.getState?.();
  if (initialState) {
    activeSequence = initialState.activeSequence || 1;
    renderSceneCards(initialState);
  }
})();

function routeTravelProgress(p) {
  const t = Math.max(0, Math.min(1, Number(p) || 0));
  // 2× softer Route Travel endpoints. A 7th-order smoothstep keeps
  // acceleration/deceleration much gentler while preserving the same route distance
  // and the same 1.5 s maximum window. Core/wheel mechanics are untouched.
  const t2 = t * t;
  const t3 = t2 * t;
  const t4 = t3 * t;
  return t4 * (35 - 84 * t + 70 * t2 - 20 * t3);
}

      function findFreeViewportButtonSlot(halfNdcX,halfNdcY,blockedRects,occupiedRects,desiredAngle,z){

      function updateOrbitalSquares(dt,motionActive){

      function navigateToSequence(sequenceNumber,{source='api',forceForward=false,minDuration=0,duration=0,travelSteps=0}={}){

          logicalGroupStart=card.userData.sequenceNumber;
          sequenceDirection=card.userData.sequenceStep>=currentSequenceCoord()?1:-1;
          logicalGroupDirection=sequenceDirection;
          moveCameraToStep(card.userData.sequenceStep);
        }
      });

      function applyPass4WheelDelta(deltaY,inputNow,{updateLogical=true}={}){
        if(Math.abs(deltaY)<.0001) return;
        heroFlipTarget=0; hoveredCard=null; hoveredSquare=null;
        lastInputAt=inputNow;
        sequenceDirection=deltaY>=0?1:-1;
        supportBiasDirection=sequenceDirection;
        if(updateLogical) registerLogicalGroupGesture(deltaY,inputNow);
        // Exact Pass 4 camera rule used by BOTH real wheel input and internal-link travel.
        if(cameraTween){cameraTween.kill();cameraTween=null;}
        targetT-=deltaY*SENSITIVITY;
        setCamT(targetT);
        settleSnapDone=true;
      }

      Observer.create({
        target:window,type:'wheel,touch',
        onChange:self=>{
          if(navigationActive || routeTravelActive || grabbedCard) return;
          if(Math.abs(self.deltaY)<.01) return;
          applyPass4WheelDelta(self.deltaY,performance.now(),{updateLogical:true});
        }
      });

      let previousFrame=performance.now();
      function animate(now=performance.now()){
        requestAnimationFrame(animate);
        const dt=Math.min((now-previousFrame)/1000,.05); previousFrame=now;
        const flowOffsetT=wrap01(now*0.001*FLOW_CLOCKWISE_SPEED);
        updateFlowInstances(flowOffsetT);
        // Blue flow squares are scroll-coupled, not clock-coupled: when cards stop, squares stop too.
        const orbitalFlowOffsetT=wrap01(camProxy.t);
        if(TINY_ORBITAL_FLOW_ENABLED) updateOrbitalFlowSquares(orbitalFlowOffsetT);
        flowMaterial.uniforms.uOrbitAngle.value=0;

        const t=wrap01(1-camProxy.t);
        const pathPos=curve.getPoint(t);
        camera.position.set(pathPos.x,pathPos.y,pathPos.z+CAM_Z);

        // Static premium lighting: no moving 'sun' sweep across the cards.
        glassLightTarget.position.set(pathPos.x,pathPos.y,pathPos.z);
        glassKey.position.set(
          pathPos.x+8.8,
          pathPos.y+5.6,
          pathPos.z+7.2
        );
        glassFill.position.set(
          pathPos.x-7.4,
          pathPos.y-4.8,
          pathPos.z+4.0
        );
        flowMaterial.uniforms.uCurveT.value=t;
        flowMaterial.uniforms.uCameraPos.value.copy(camera.position);
        orbitalFlowSquareMaterial.uniforms.uCurveT.value=t;
        orbitalFlowSquareMaterial.uniforms.uCameraPos.value.copy(camera.position);

        if(routeTravelActive){
          const elapsed=now-routeTravelStartedAt;
          if(elapsed<routeTravelDriveMs){
            const p=THREE.MathUtils.clamp(elapsed/routeTravelDriveMs,0,1);
            // Smooth wheel pressure: gentle acceleration, long middle glide, gentle release.
            // This still feeds the exact same Pass 4 wheel function as physical scrolling.
            const progress=routeTravelProgress(p);
            const cumulative=routeTravelTotalDeltaY*progress;
            const delta=cumulative-routeTravelAppliedDeltaY;
            if(delta>.0001){
              routeTravelAppliedDeltaY=cumulative;
              applyPass4WheelDelta(delta,now,{updateLogical:false});
            }
          }else if(routeTravelAppliedDeltaY<routeTravelTotalDeltaY){
            const delta=routeTravelTotalDeltaY-routeTravelAppliedDeltaY;
            routeTravelAppliedDeltaY=routeTravelTotalDeltaY;
            applyPass4WheelDelta(delta,now,{updateLogical:false});
          }

          // Finish naturally as soon as the camera has nearly caught its final wheel target.
          // Never exceed the 1.5 s ceiling requested for route loading.
          const cameraSettled=routeTravelAppliedDeltaY>=routeTravelTotalDeltaY-.0001 && Math.abs(camProxy.t-targetT)<=ROUTE_TRAVEL.cameraSettleEpsilon;
          if(cameraSettled || elapsed>=ROUTE_TRAVEL.maxDurationMs) finishRouteTravel();
        }

        if(navigationActive && navigationTargetStep!==null){
          const arrived=Math.abs(currentSequenceCoord()-navigationTargetStep)<=NAVIGATION_ARRIVAL_EPSILON;
          const timedOut=now-navigationStartedAt>navigationExpectedDuration*1400;
          if(arrived||timedOut) finishNavigation();
        }

        // Input release never invents another destination. Repeated accepted impulses already
        // moved manualGestureTargetStep one adjacent card at a time; settle only freezes support count.
        if(!navigationActive && manualGestureActive && !settleSnapDone && now-lastInputAt>SETTLE_DELAY_MS){
          // Freeze the largest count revealed so far. Already-active supports never disappear
          // merely because the next gesture was short; they keep flowing with the ring.
          retainedVisibleCount=THREE.MathUtils.clamp(
            Math.max(retainedVisibleCount,gestureVisibleCount),
            MIN_VISIBLE_ACTIVE,MAX_VISIBLE_ACTIVE
          );
          gestureVisibleCount=retainedVisibleCount;
          settleSnapDone=true;
        }
        if(!navigationActive && manualGestureActive && now-lastInputAt>SETTLE_DELAY_MS){
          const arrived=Math.abs(currentSequenceCoord()-manualGestureTargetStep)<=MANUAL_GESTURE_ARRIVAL_EPSILON;
          if(arrived){
            camProxy.t=-manualGestureTargetStep/ORIGINAL_SEQUENCE_TOTAL;
            targetT=camProxy.t;
            manualGestureOriginStep=manualGestureTargetStep;
            manualGestureActive=false;
          }
        }

        // Numbering commits only after the original visual tween has actually stopped.
        commitLogicalGroupIfStopped(now);

        const coord=currentSequenceCoord();
        const routeTransitActive=routeTravelActive;
        const inputActive=manualGestureActive || navigationActive || now-lastInputAt<=SETTLE_DELAY_MS;
        const carouselMotionActive=navigationActive || Math.abs(camProxy.t-targetT)>GROUP_VISUAL_STOP_EPSILON || now-lastInputAt<=SETTLE_DELAY_MS;

        // Route travel must remain true scroll motion internally. Cards continue following the
        // carousel exactly as during wheel scrolling; they are hidden only for the final render.
        updateActiveFlow(coord,dt,inputActive);
        if(!routeTransitActive) updateHoverSelection();
        else{hoveredCard=null;hoveredSquare=null;renderer.domElement.style.cursor='default';}
        for(const card of activeCards) if(card.visible) applyHoverPose(card,dt);
        for(const card of activeCards) if(card.visible || card.userData.grabMix>.001) applyGrabPose(card,dt);

        // Hero is always the nearest face card and always the highest layer outside active grab/play mode. The outgoing
        // hero still flies with the flow; dominance transfers only when the next card is nearer.
        if(heroCard){
          const currentHeroStep=heroCard.userData.sequenceStep;
          // Flip belongs to one hero identity only. If scroll hands dominance to the next card
          // before the previous flip has fully settled, the incoming hero always starts face-on.
          if(flipOwnerSequenceStep!==null && currentHeroStep!==flipOwnerSequenceStep){
            heroFlipCurrent=0;
            heroFlipTarget=0;
          }
          flipOwnerSequenceStep=currentHeroStep;
          const a=1-Math.exp(-HERO_FLIP_DAMP*dt);
          heroFlipCurrent=THREE.MathUtils.lerp(heroFlipCurrent,heroFlipTarget,a);
          for(const card of activeCards) if(card.visible && card!==heroCard) card.rotation.y=0;
          heroCard.rotation.y=heroFlipCurrent;
          if(grabbedCard!==heroCard) setCardRenderOrder(heroCard,HERO_RENDER_ORDER);
          if(grabbedCard && grabbedCard!==heroCard) setCardRenderOrder(grabbedCard,GRAB_RENDER_ORDER);
        }

        // Satellites resolve their slots only after every visible card has reached its final frame pose,
        // so the blue squares never disappear behind hero/support cards and always occupy free screen-space.
        updateOrbitalSquares(dt,carouselMotionActive);
        applyOrbitalSquareHover(dt);
        updateHeroNdcBounds();
        for(const card of activeCards) updateNumberLabel(card);
        scene.userData.activeLogicalCard=heroCard?.userData.sequenceNumber||1;
        scene.userData.activeSequenceStep=heroCard?.userData.sequenceStep||0;
        scene.userData.sequenceDirection=sequenceDirection;
        scene.userData.heroFlipped=heroFlipTarget>Math.PI*.5;
        scene.userData.visibleActiveCount=activeCards.filter(c=>c.visible && (c.userData.presence??0)>.08).length;
        scene.userData.supportSettleActive=!inputActive;
        publishSceneState();

        // Internal URL transition: the user sees only travel through the carousel world.
        // The 7 foreground content cards are NOT allowed to flip past the camera during loading.
        if(routeTransitActive){
          const cardVisibility=activeCards.map(card=>card.visible);
          const squareVisibility=orbitalSquares.map(square=>square.visible);
          for(const card of activeCards){
            card.visible=false;
            if(card.userData.label) card.userData.label.style.display='none';
          }
          for(const square of orbitalSquares) square.visible=false;
          composer.render();
          activeCards.forEach((card,i)=>{card.visible=cardVisibility[i];});
          orbitalSquares.forEach((square,i)=>{square.visible=squareVisibility[i];});
        }else{
          composer.render();
        }
      }

      // Initial visible logical group is exactly 1,2,3,4,5 with hero 1.
      // VISUAL SCROLL remains original V33/Pass 4 and can travel any distance.
      // LOGICAL SEQUENCE changes only once after a complete stop: next hero = current hero +/- 1.
      // The completed gesture may change only the visible group size (1..7); it never changes how many logical cards are advanced.
      ensureAssignments(0);
      animate();
    }

    init();
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});

</script>
</body>
