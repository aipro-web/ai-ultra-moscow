<!doctype html>
<html lang="ru" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AI Ultra — Pure Carousel Core</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050607;color:#fff;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#canvas-container{position:fixed;inset:0;width:100vw;height:100vh}
canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
#status{display:none;position:fixed;left:16px;top:16px;z-index:60000;max-width:min(560px,calc(100vw - 32px));padding:10px 12px;border:1px solid #ffffff22;border-radius:10px;background:#111e;color:#fff;font:12px/1.4 system-ui}
#status.show{display:block}
.card-number{position:fixed;left:0;top:0;z-index:8100;pointer-events:none;min-width:30px;padding:5px 7px 6px;border-radius:8px;background:#05060799;border:1px solid #ffffff24;color:#fff;font:800 clamp(20px,2vw,28px)/.95 system-ui;text-align:center;text-shadow:0 1px 9px #000;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transform-origin:0 0}
.card-number.is-hero{min-width:40px;font-size:clamp(28px,3vw,38px)}
.core-overlay{position:fixed;inset:0;z-index:56000;opacity:0;pointer-events:none;background:rgba(0,0,0,.18);backdrop-filter:blur(0);transition:opacity .2s ease,backdrop-filter .25s ease}
body.core-search-open .core-search,body.core-menu-open .core-menu{opacity:1;pointer-events:auto;backdrop-filter:blur(5px)}
.core-search-panel{position:absolute;left:50%;top:7vh;width:min(760px,calc(100vw - 64px));border:1px solid rgba(255,255,255,.16);border-radius:26px;background:rgba(6,10,15,.93);box-shadow:0 28px 90px rgba(0,0,0,.55),0 0 40px rgba(75,190,255,.1);transform:translate(-50%,-24px) scale(.97);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
body.core-search-open .core-search-panel{transform:translate(-50%,0) scale(1)}
.core-search-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;min-height:72px;padding:0 18px 0 22px;border-bottom:1px solid rgba(255,255,255,.1)}
.core-search-icon{font:400 30px/1 system-ui;color:#8fe0ff}
.core-search-input{width:100%;border:0;outline:0;background:transparent;color:#fff;font:600 clamp(16px,2vw,24px)/1.2 system-ui}
.core-search-input::placeholder{color:rgba(255,255,255,.4)}
.core-empty{padding:18px 22px 22px;color:rgba(255,255,255,.55);font:500 13px/1.45 system-ui}
.core-close{width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font:300 26px/1 system-ui}
.core-menu-panel{position:absolute;right:24px;top:24px;bottom:24px;width:min(360px,calc(100vw - 48px));border:1px solid rgba(255,255,255,.16);border-radius:26px;background:rgba(6,10,15,.94);box-shadow:0 28px 90px rgba(0,0,0,.55);transform:translateX(calc(100% + 48px));transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow:hidden}
body.core-menu-open .core-menu-panel{transform:translateX(0)}
.core-menu-head{height:68px;padding:0 16px 0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.1)}
.core-menu-head strong{font:800 13px/1 system-ui;letter-spacing:.15em}
.core-menu-body{display:grid;gap:8px;padding:12px}
.core-menu-body button{border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(255,255,255,.035);color:#fff;padding:13px 14px;text-align:left;cursor:pointer;font:600 13px/1 system-ui}
.core-menu-body button:hover{background:rgba(90,190,255,.1)}
.core-toast{position:fixed;left:50%;bottom:28px;z-index:60000;padding:9px 13px;border-radius:999px;background:rgba(5,8,12,.88);border:1px solid rgba(255,255,255,.14);color:#fff;font:600 12px/1 system-ui;opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:opacity .16s ease,transform .16s ease;backdrop-filter:blur(10px)}
.core-toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body data-carousel-core="pure">
<div id="canvas-container" aria-hidden="true"></div>
<div id="status" role="status" aria-live="polite"></div>
<script src="./src/bootstrap.js"></script>
<script src="./src/ui.js"></script>
<script type="module" src="./src/carousel-core.mjs"></script>
</body>
</html>
